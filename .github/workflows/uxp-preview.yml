name: UXP development checks
on:
  push:
    branches: ['feat/uxp-*']
  pull_request:
    paths: ['uxp/**', 'backend/**', 'tests/**', 'scripts/**', 'release.json', '.github/workflows/uxp-preview.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.3.5
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm test
      - run: python -m unittest discover -s tests -p "test_*.py" -v
      - run: python scripts/build_release.py
      - run: mkdir -p artifacts && cp ../EditFlow-Pro-*-Unified.zip artifacts/
      - uses: actions/upload-artifact@v4
        with:
          name: EditFlow-unified-development-preview
          path: artifacts/*.zip
