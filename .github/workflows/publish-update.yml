name: Publish EditFlow Pro Update
on:
  push:
    paths:
      - 'staging/*.zip'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: editflow-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate newest staged package
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, os, re, shutil, zipfile
          candidates = []
          for path in glob.glob('staging/*.zip'):
              with zipfile.ZipFile(path) as z:
                  infos = z.infolist()
                  names = [i.filename for i in infos]
                  if len(infos)>100 or sum(i.file_size for i in infos)>50_000_000:
                      raise SystemExit(f'Invalid ZIP size: {path}')
                  if len(names)!=len(set(names)) or any(n.startswith('/') or '..' in n.split('/') or '\\' in n for n in names):
                      raise SystemExit(f'Unsafe ZIP entries: {path}')
                  required={'plugin/CSXS/manifest.xml','plugin/main.js','plugin/index.html','backend/server.py'}
                  if not required.issubset(names): raise SystemExit(f'Missing required files: {path}')
                  forbidden=('.env','cep-launcher.json','pairing','token','secret','.prproj','.wav','.mp4','.pkl')
                  if any(any(s in n.lower() for s in forbidden) for n in names):
                      raise SystemExit(f'Potentially sensitive content: {path}')
                  manifest=z.read('plugin/CSXS/manifest.xml').decode('utf-8')
                  match=re.search(r'ExtensionBundleVersion="([0-9]+\.[0-9]+\.[0-9]+)"', manifest)
                  if not match: raise SystemExit(f'Invalid version: {path}')
                  version=match.group(1)
                  candidates.append((tuple(map(int,version.split('.'))),version,path))
          if not candidates: raise SystemExit('No staged release packages')
          _, version, source=max(candidates)
          shutil.copyfile(source,'EditFlow-Pro-Update.zip')
          print('Publishing',version,'from',source)
          with open(os.environ['GITHUB_OUTPUT'],'a') as out: out.write('version='+version+'\n')
          PY
          sha256sum EditFlow-Pro-Update.zip > EditFlow-Pro-Update.zip.sha256
      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v${RELEASE_VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists: $TAG"
            exit 0
          fi
          gh release create "$TAG" \
            EditFlow-Pro-Update.zip \
            EditFlow-Pro-Update.zip.sha256 \
            --title "EditFlow Pro $TAG" \
            --notes "Experimental release. Back up Premiere project and test on a duplicate sequence." \
            --latest
