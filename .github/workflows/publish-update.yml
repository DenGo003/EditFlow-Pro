name: Publish reviewed EditFlow unified release
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: editflow-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Require reviewed source and Windows host acceptance
        run: |
          test "$GITHUB_REF" = refs/heads/main
          python3 - <<'PY'
          import json
          data=json.load(open('release.json',encoding='utf-8'))
          if data.get('targetPremiere') != '25.6.2' or data.get('hostVerified') is not True:
              raise SystemExit('Windows/Premiere 25.6.2 acceptance is still pending; no production release')
          PY
      - name: Install test dependencies
        run: |
          python -m pip install numpy==2.3.5
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Verify unified source
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v
          npm test
      - name: Build and check unified ZIP
        id: prepare
        run: |
          python scripts/build_release.py
          python - <<'PY'
          import json, os, pathlib
          from backend.update_manager import inspect_bundle
          version=json.loads(pathlib.Path('release.json').read_text())['version']
          archive=pathlib.Path('..') / f'EditFlow-Pro-{version}-Unified.zip'
          inspect_bundle(archive,version,'0.0.0')
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write(f'version={version}\n')
          PY
          VERSION=$(python -c "import json; print(json.load(open('release.json'))['version'])")
          cd ..
          sha256sum "EditFlow-Pro-${VERSION}-Unified.zip" > "EditFlow-Pro-${VERSION}-Unified.zip.sha256"
      - name: Publish versioned GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          set -euo pipefail
          test ! -z "$RELEASE_VERSION"
          TAG="v${RELEASE_VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists: $TAG"
            exit 1
          fi
          gh release create "$TAG" \
            "../EditFlow-Pro-${RELEASE_VERSION}-Unified.zip" \
            "../EditFlow-Pro-${RELEASE_VERSION}-Unified.zip.sha256" \
            --title "EditFlow Pro $TAG" \
            --notes "Reviewed unified update for Premiere Pro 25.6.2." \
            --target main --latest
