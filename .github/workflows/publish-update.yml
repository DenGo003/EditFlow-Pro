name: Publish EditFlow Pro Update

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semver e.g. 0.7.7"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: editflow-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate release package and version
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid version"; exit 1; }
          test -f staging/EditFlow-Pro-Update.zip
          python3 - <<'PY'
          import os, zipfile
          name = "staging/EditFlow-Pro-Update.zip"
          with zipfile.ZipFile(name) as z:
              names = z.namelist()
              if len(names) > 100 or sum(i.file_size for i in z.infolist()) > 50_000_000:
                  raise SystemExit("Unexpected package size")
              required = {"plugin/CSXS/manifest.xml", "plugin/main.js", "plugin/index.html", "backend/server.py"}
              if not required.issubset(set(names)):
                  raise SystemExit("Missing required program files")
              if any(n.startswith("/") or ".." in n.split("/") or "\\" in n for n in names):
                  raise SystemExit("Unsafe archive path")
              forbidden = (".env", "cep-launcher.json", "pairing", "token", "secret", ".prproj", ".wav", ".mp4", ".pkl")
              if any(any(x in n.lower() for x in forbidden) for n in names):
                  raise SystemExit("Possibly sensitive file in package")
              manifest = z.read("plugin/CSXS/manifest.xml").decode("utf-8")
              version = os.environ["RELEASE_VERSION"]
              if ('ExtensionBundleVersion="' + version + '"') not in manifest:
                  raise SystemExit("Manifest version != release version")
          PY
          cp staging/EditFlow-Pro-Update.zip EditFlow-Pro-Update.zip
          sha256sum EditFlow-Pro-Update.zip > EditFlow-Pro-Update.zip.sha256
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v${RELEASE_VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists. Refusing overwrite: $TAG"
            exit 1
          fi
          gh release create "$TAG" \
            EditFlow-Pro-Update.zip \
            EditFlow-Pro-Update.zip.sha256 \
            --title "EditFlow Pro $TAG" \
            --notes "EditFlow Pro update. Back up projects and restart Premiere when prompted." \
            --latest
